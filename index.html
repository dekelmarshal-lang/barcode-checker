<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
</head>
<body style="margin:0">
<title>בודק התאמת QR ו-Data Matrix</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;700&family=IBM+Plex+Sans+Hebrew:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one-handed scanning station — camera stage fills the top, two capture slots under it, big action button at thumb height, results log below */
:root{
  --bg:#eef1f3; --surface:#ffffff; --sunken:#e3e8eb; --line:#cfd6db;
  --ink:#16222b; --muted:#56646e; --accent:#0b5d7a; --accent-ink:#ffffff;
  --ok:#147a39; --ok-strong:#1c9a4a; --warn:#8a5200; --bad:#b3261e; --bad-strong:#c62f26;
  --stage:#0c1216;
  --f-display:"Rubik","IBM Plex Sans Hebrew",system-ui,sans-serif;
  --f-body:"IBM Plex Sans Hebrew","Rubik",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1519; --surface:#172027; --sunken:#111a20; --line:#2a3943;
  --ink:#e8eef2; --muted:#9aaab4; --accent:#4fb3d6; --accent-ink:#06222c;
  --ok:#5ccf83; --ok-strong:#1c8a44; --warn:#f0b452; --bad:#ff8a80; --bad-strong:#b3261e;
  --stage:#05080a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1519; --surface:#172027; --sunken:#111a20; --line:#2a3943;
  --ink:#e8eef2; --muted:#9aaab4; --accent:#4fb3d6; --accent-ink:#06222c;
  --ok:#5ccf83; --ok-strong:#1c8a44; --warn:#f0b452; --bad:#ff8a80; --bad-strong:#b3261e;
  --stage:#05080a; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.45}
.wrap{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:12px 32px;display:grid;gap:12px}
header{display:flex;align-items:center;gap:10px}
h1{font-family:var(--f-display);font-weight:700;font-size:1.15rem;margin:0;flex:1;text-wrap:balance}
.count{display:flex;gap:6px;font-variant-numeric:tabular-nums;font-family:var(--f-mono);font-weight:500}
.count span{border-radius:8px;padding:3px 9px;font-size:.95rem;background:var(--surface);border:1px solid var(--line)}
.count .c-ok{color:var(--ok)} .count .c-bad{color:var(--bad)}

button,.btn{font:inherit;font-weight:600;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:10px 16px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;position:relative}
button:focus-visible,.btn:focus-within,input:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.icon{width:22px;height:22px;flex:none}

/* stage */
.stage{position:relative;background:var(--stage);border-radius:16px;overflow:hidden;aspect-ratio:4/3;max-width:100%;color:#fff}
.stage video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.stage .frame{position:absolute;inset:12% 8%;border:3px solid rgba(255,255,255,.75);border-radius:14px;pointer-events:none}
.idle{position:absolute;inset:0;display:grid;place-content:center;justify-items:center;gap:10px;padding:20px;text-align:center}
.idle p{margin:0;color:#c9d4da;font-size:.95rem;max-width:34ch}
.idle .err{color:#ffd0cc}
.tool{position:absolute;top:10px;min-height:44px;min-width:44px;padding:8px;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;border-color:rgba(255,255,255,.35)}
.tool.on{background:#fff;color:#000}
#bTorch{inset-inline-start:10px} #bStop{inset-inline-end:10px}

/* result overlay */
.result{position:absolute;inset:0;display:grid;place-content:center;justify-items:center;gap:6px;padding:18px;text-align:center;color:#fff}
.result.ok{background:var(--ok-strong)} .result.warn{background:var(--ok-strong)} .result.bad{background:var(--bad-strong)}
.result svg{width:84px;height:84px}
.result .big{font-family:var(--f-display);font-weight:700;font-size:2.4rem;line-height:1}
.result .why{font-size:.95rem;max-width:36ch;opacity:.95}
.result .diffbox{font-family:var(--f-mono);font-size:.8rem;direction:ltr;text-align:left;background:rgba(0,0,0,.28);border-radius:8px;padding:8px 10px;max-width:100%;word-break:break-all;display:grid;gap:4px}
.result .diffbox b{font-weight:500;opacity:.75;font-family:var(--f-body)}
.result mark{background:#fff;color:var(--bad-strong);border-radius:2px;padding:0 1px}
.result button{margin-top:6px;background:#fff;color:#111;border:none;min-width:200px;font-size:1.1rem}
.result .bar{height:4px;background:rgba(255,255,255,.85);border-radius:2px;width:160px;transform-origin:right}
@media (prefers-reduced-motion:no-preference){.result .bar.run{animation:shrink var(--dur,1.2s) linear forwards}}
@keyframes shrink{to{transform:scaleX(0)}}

/* slots */
.slots{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.slot{background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:10px 12px;min-width:0;display:grid;gap:2px}
.slot .h{display:flex;align-items:center;gap:6px;font-weight:600;font-size:.95rem}
.slot .h .dot{width:22px;height:22px;border-radius:50%;border:2px solid var(--muted);display:grid;place-items:center;flex:none}
.slot .v{font-family:var(--f-mono);font-size:.78rem;color:var(--muted);direction:ltr;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:1.2em}
.slot.full{border-color:var(--accent)}
.slot.full .dot{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

.main{width:100%;min-height:64px;font-size:1.2rem;background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.scan{display:flex;gap:8px}
.scan input{flex:1;min-width:0;font-family:var(--f-mono);font-size:1rem;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);min-height:52px}
.status{min-height:1.4em;font-size:.95rem;color:var(--muted);text-align:center}
.status.err{color:var(--bad)}

details{background:var(--surface);border:1px solid var(--line);border-radius:12px}
summary{cursor:pointer;padding:14px;font-weight:600;list-style:none;display:flex;align-items:center;gap:8px;min-height:52px}
summary::-webkit-details-marker{display:none}
summary .chev{margin-inline-start:auto;transition:transform .15s}
details[open] summary .chev{transform:rotate(180deg)}
.inner{padding:0 14px 14px;display:grid;gap:12px}
.opt{display:flex;align-items:center;gap:10px;min-height:44px;cursor:pointer}
.opt input{width:22px;height:22px;accent-color:var(--accent);flex:none}
.opt small{display:block;color:var(--muted);font-size:.85rem}
.log{list-style:none;margin:0;padding:0;display:grid}
.log li{display:grid;grid-template-columns:auto auto 1fr;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line);font-size:.9rem;font-variant-numeric:tabular-nums}
.log .t{color:var(--muted);font-family:var(--f-mono);font-size:.8rem}
.log .d{font-family:var(--f-mono);font-size:.75rem;color:var(--muted);direction:ltr;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.pill{font-size:.8rem;font-weight:700;border-radius:99px;padding:2px 10px;white-space:nowrap}
.pill.ok,.pill.warn{color:var(--ok);border:1.5px solid var(--ok)} .pill.bad{color:#fff;background:var(--bad)}
.muted{color:var(--muted);font-size:.9rem}
.small{min-height:44px;font-size:.95rem}
textarea{width:100%;font-family:var(--f-mono);font-size:.8rem;background:var(--sunken);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>

<div class="wrap" dir="rtl">
  <header>
    <h1>בודק התאמת QR ו-Data Matrix</h1>
    <div class="count" aria-label="מונה בדיקות">
      <span class="c-ok" title="תואמים">✓ <b id="nOk">0</b></span>
      <span class="c-bad" title="לא תואמים">✗ <b id="nBad">0</b></span>
    </div>
  </header>

  <div class="stage" id="stage">
    <video id="vid" playsinline muted hidden></video>
    <div class="frame" id="frame" hidden></div>
    <button class="tool" id="bTorch" type="button" hidden aria-label="פנס" aria-pressed="false">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 2h10l-2 6H9zM9 8v12a1 1 0 001 1h4a1 1 0 001-1V8M12 12v3"/></svg>
    </button>
    <button class="tool" id="bStop" type="button" hidden aria-label="עצור מצלמה">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
    <div class="idle" id="idle">
      <svg viewBox="0 0 64 64" width="64" height="64" fill="none" stroke="currentColor" stroke-width="3" aria-hidden="true"><path d="M6 18V6h12M46 6h12v12M58 46v12H46M18 58H6V46"/><rect x="18" y="18" width="12" height="12"/><rect x="36" y="34" width="10" height="10"/><path d="M36 18h10v10M18 36v10h10"/></svg>
      <p id="idleMsg">לחץ "התחל סריקה" וכוון את המצלמה לקודים. אפשר לסרוק אותם בכל סדר, או את שניהם יחד בפריים אחד.</p>
    </div>
    <div class="result" id="result" hidden role="alert"></div>
  </div>

  <div class="slots">
    <div class="slot" id="s-qr"><div class="h"><span class="dot" aria-hidden="true"></span>QR</div><div class="v" id="v-qr">ממתין</div></div>
    <div class="slot" id="s-dm"><div class="h"><span class="dot" aria-hidden="true"></span>Data Matrix</div><div class="v" id="v-dm">ממתין</div></div>
  </div>

  <button class="main" id="bMain" type="button">
    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M3 7V4h3M21 7V4h-3M3 17v3h3M21 17v3h-3M3 12h18"/></svg>
    <span id="bMainTxt">התחל סריקה</span>
  </button>
  <div class="status" id="status" aria-live="polite"></div>

  <div class="row">
    <label class="btn small">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>
      צילום תמונה
      <input id="fCam" type="file" accept="image/*" capture="environment">
    </label>
    <button class="small" id="bReset" type="button">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 12a8 8 0 1 0 2.4-5.7M4 4v4h4"/></svg>
      נקה את הזוג
    </button>
  </div>
  <div class="scan">
    <label for="scanIn" class="sr">קלט מסורק ידני</label>
    <input id="scanIn" type="text" dir="ltr" autocomplete="off" spellcheck="false" placeholder="סורק ידני / הקלדה + Enter">
  </div>

  <details id="logBox">
    <summary>יומן בדיקות <span class="muted" id="logCount"></span><svg class="chev icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg></summary>
    <div class="inner">
      <div class="row">
        <button class="small" id="bCsv" type="button">העתק כ-CSV</button>
        <button class="small" id="bClear" type="button">איפוס יומן</button>
      </div>
      <div id="clearAsk" class="row" hidden>
        <button class="small" id="bClearYes" type="button" style="color:var(--bad)">מחק הכל</button>
        <button class="small" id="bClearNo" type="button">ביטול</button>
      </div>
      <textarea id="csvOut" rows="5" readonly dir="ltr" hidden></textarea>
      <ul class="log" id="log"></ul>
      <p class="muted" id="logEmpty">כל השוואה נרשמת כאן אוטומטית.</p>
    </div>
  </details>

  <details>
    <summary>הגדרות<svg class="chev icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg></summary>
    <div class="inner">
      <label class="opt"><input type="checkbox" id="oAuto" checked><span>המשך אוטומטי אחרי התאמה<small>מעבר לאריזה הבאה תוך שנייה. אי-התאמה תמיד עוצרת לאישור.</small></span></label>
      <label class="opt"><input type="checkbox" id="oStrict"><span>השוואה מחמירה<small>תו מול תו. בלי זה, "(01)…" ומחרוזת GS1 גולמית עם אותם נתונים נחשבים תואמים.</small></span></label>
      <label class="opt"><input type="checkbox" id="oSound" checked><span>צליל ורטט</span></label>
    </div>
  </details>
</div>

<script src="https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js"></script>
<script>
(function(){
const $=id=>document.getElementById(id);
const NAMES={qr:'QR',dm:'Data Matrix'}, GS='\u001d';
let pending={qr:null,dm:null}, phase='scan', history=[], autoTimer=null;
const seen=new Map(); // text -> last time seen in live view
try{history=JSON.parse(localStorage.getItem('bcm-history')||'[]')}catch(e){}
try{const o=JSON.parse(localStorage.getItem('bcm-opts2')||'{}');['oAuto','oStrict','oSound'].forEach(k=>{if(k in o)$(k).checked=o[k]})}catch(e){}
['oAuto','oStrict','oSound'].forEach(k=>$(k).addEventListener('change',()=>{try{localStorage.setItem('bcm-opts2',JSON.stringify({oAuto:$('oAuto').checked,oStrict:$('oStrict').checked,oSound:$('oSound').checked}))}catch(e){}}));

/* ---------- GS1 compare ---------- */
function aiSpec(ai){
  const t={'00':18,'01':14,'02':14,'03':14,'11':6,'12':6,'13':6,'15':6,'16':6,'17':6,'20':2,'402':17,'422':3,'7003':10,'7006':6};
  const v={'10':20,'21':20,'22':20,'30':8,'37':8,'235':28,'240':30,'241':30,'242':6,'250':30,'251':30,'253':30,'254':20,'400':30,'401':30,'403':30,'420':20,'421':12,'8008':12,'8020':25};
  if(t[ai])return{len:t[ai]}; if(v[ai])return{max:v[ai]};
  if(/^3[1-6]\d\d$/.test(ai))return{len:6}; if(/^39[23]\d$/.test(ai))return{max:18};
  if(/^41[0-7]$/.test(ai))return{len:13}; if(/^9\d$/.test(ai))return{max:90};
  return null;
}
const AIN={'00':'SSCC','01':'GTIN','02':'GTIN תכולה','10':'אצווה','11':'תאריך ייצור','13':'תאריך אריזה','15':'עדיף לפני','17':'תוקף','21':'מספר סידורי','30':'כמות','37':'כמות'};
function parseGS1(raw){
  let s=raw.replace(/^\][A-Za-z]\d/,'').trim(); const out=[];
  if(s.startsWith('(')){
    const re=/\((\d{2,4})\)([^(]*)/g;let m,pos=0;
    while((m=re.exec(s))){if(m.index!==pos)return null;out.push({ai:m[1],v:m[2].replace(/[\u001d\s]+$/,'')});pos=re.lastIndex;}
    return pos===s.length&&out.length&&out.every(e=>aiSpec(e.ai))?out:null;
  }
  s=s.replace(/^\u001d/,''); if(!/^\d{2}/.test(s))return null;
  let i=0;
  while(i<s.length){
    if(s[i]===GS){i++;continue}
    let ai=null;for(const n of[2,3,4]){const c=s.substr(i,n);if(c.length===n&&/^\d+$/.test(c)&&aiSpec(c)){ai=c;break}}
    if(!ai)return null;
    const sp=aiSpec(ai);i+=ai.length;let v;
    if(sp.len){v=s.substr(i,sp.len);if(v.length!==sp.len)return null;i+=sp.len}
    else{let j=s.indexOf(GS,i);if(j<0)j=s.length;v=s.slice(i,j);if(v.length>sp.max)return null;i=j}
    out.push({ai,v});
  }
  return out.length?out:null;
}
const norm=t=>t.replace(/^\][A-Za-z]\d/,'').replace(/[\u0000-\u001f\u007f\s]/g,'');
function compare(a,b){
  if(a===b)return{level:'ok',why:'זהים תו מול תו'};
  const strict=$('oStrict').checked;
  if(!strict){
    const pa=parseGS1(a),pb=parseGS1(b);
    if(pa&&pb){
      const ma=new Map(pa.map(e=>[e.ai,e.v])),mb=new Map(pb.map(e=>[e.ai,e.v])),bad=[];
      new Set([...ma.keys(),...mb.keys()]).forEach(k=>{if(ma.get(k)!==mb.get(k))bad.push(k)});
      if(!bad.length)return{level:'warn',why:'כל שדות GS1 זהים, הייצוג שונה'};
      return{level:'bad',why:'שדה שונה: '+bad.map(k=>'('+k+')'+(AIN[k]?' '+AIN[k]:'')).join(', '),fields:bad.map(k=>({ai:k,a:ma.get(k)??'—',b:mb.get(k)??'—'}))};
    }
    if(norm(a)===norm(b))return{level:'warn',why:'התוכן זהה, הבדל בתווי בקרה בלבד'};
  }
  return{level:'bad',why:strict?'הקודים שונים (השוואה מחמירה)':'הקודים שונים'};
}

/* ---------- display helpers ---------- */
const CC={29:'GS',30:'RS',4:'EOT',13:'CR',10:'LF',9:'TAB'};
const show=t=>[...t].map(c=>{const k=c.charCodeAt(0);return k<32||k===127?'<'+(CC[k]||k)+'>':c}).join('');
const esc=s=>s.replace(/[&<>"]/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[x]));
function markDiff(a,b){ // highlight differing middle segment of each
  const A=[...show(a)],B=[...show(b)];let p=0;while(p<A.length&&p<B.length&&A[p]===B[p])p++;
  let s=0;while(s<A.length-p&&s<B.length-p&&A[A.length-1-s]===B[B.length-1-s])s++;
  const f=X=>esc(X.slice(0,p).join(''))+'<mark>'+esc(X.slice(p,X.length-s).join(''))+'</mark>'+esc(X.slice(X.length-s).join(''));
  return[f(A),f(B)];
}
function status(t,err){const s=$('status');s.textContent=t||'';s.className='status'+(err?' err':'');}
function renderSlots(){
  for(const k of['qr','dm']){
    $('s-'+k).classList.toggle('full',!!pending[k]);
    $('s-'+k).querySelector('.dot').textContent=pending[k]?'✓':'';
    $('v-'+k).textContent=pending[k]?show(pending[k].text):'ממתין';
  }
}

/* ---------- sound ---------- */
let actx=null;
function tone(f,d,w){try{actx=actx||new(window.AudioContext||window.webkitAudioContext)();const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=f;o.connect(g);g.connect(actx.destination);const t=actx.currentTime+(w||0);g.gain.setValueAtTime(.2,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.start(t);o.stop(t+d)}catch(e){}}
function vib(p){try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}}
const fx={
  capture(){if($('oSound').checked){tone(1050,.07);vib(30)}},
  ok(){if($('oSound').checked){tone(880,.1);tone(1320,.14,.11);vib(60)}},
  bad(){if($('oSound').checked){tone(200,.3);tone(160,.4,.32);vib([250,100,250,100,250])}}
};

/* ---------- flow ---------- */
function accept(format,text,source){
  if(phase!=='scan')return;
  if(pending[format]&&pending[format].text===text)return;
  pending[format]={text,source};
  renderSlots();
  if(pending.qr&&pending.dm){verdict();return}
  fx.capture();
  status('נקלט '+NAMES[format]+'. עכשיו '+NAMES[format==='qr'?'dm':'qr']+'.');
}
function verdict(){
  phase='verdict';
  const a=pending.qr.text,b=pending.dm.text,res=compare(a,b);
  history.push({t:new Date().toISOString(),r:res.level,qr:a,dm:b,why:res.why});
  try{localStorage.setItem('bcm-history',JSON.stringify(history.slice(-3000)))}catch(e){}
  renderLog();
  const el=$('result');el.className='result '+res.level;el.hidden=false;
  const okIcon='<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="24" cy="24" r="21"/><path d="M14 25l7 7 13-15"/></svg>';
  const badIcon='<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="4.5" stroke-linecap="round" aria-hidden="true"><circle cx="24" cy="24" r="21"/><path d="M16 16l16 16M32 16L16 32"/></svg>';
  if(res.level==='bad'){
    let box;
    if(res.fields)box=res.fields.map(f=>'<div><b>('+f.ai+')</b> QR: '+esc(show(f.a))+'<br><b>('+f.ai+')</b> DM: '+esc(show(f.b))+'</div>').join('');
    else{const[x,y]=markDiff(a,b);box='<div><b>QR</b> '+x+'</div><div><b>DM</b> '+y+'</div>';}
    el.innerHTML=badIcon+'<div class="big">לא תואם</div><div class="why">'+esc(res.why)+'</div><div class="diffbox">'+box+'</div><button type="button" id="bAck">אשר והמשך</button>';
    fx.bad();
    status('אי-התאמה. הפרד את האריזה ולחץ "אשר והמשך".',true);
    $('bAck').focus({preventScroll:true});
  }else{
    const auto=$('oAuto').checked;
    el.innerHTML=okIcon+'<div class="big">תואם</div><div class="why">'+esc(res.why)+'</div>'+(auto?'<div class="bar run" style="--dur:1.1s"></div>':'<button type="button" id="bAck">הבא</button>');
    fx.ok();status('');
    if(auto)autoTimer=setTimeout(next,1100);else $('bAck').focus({preventScroll:true});
  }
  $('result').querySelector('#bAck')?.addEventListener('click',next);
}
function next(){
  clearTimeout(autoTimer);
  // codes still in view must leave the frame before they count again
  const now=performance.now();
  if(pending.qr)seen.set(pending.qr.text,now);
  if(pending.dm)seen.set(pending.dm.text,now);
  pending={qr:null,dm:null};phase='scan';
  $('result').hidden=true;renderSlots();
  status(stream?'סרוק את האריזה הבאה.':'');
}
function resetPair(){clearTimeout(autoTimer);pending={qr:null,dm:null};phase='scan';$('result').hidden=true;renderSlots();status('הזוג נוקה.');}

/* ---------- decoding ---------- */
let detector=null;
(async()=>{try{if('BarcodeDetector'in window){const f=await BarcodeDetector.getSupportedFormats();if(f.includes('qr_code')&&f.includes('data_matrix'))detector=new BarcodeDetector({formats:['qr_code','data_matrix']})}}catch(e){}})();
let zx=null,hints=null;
function zxReady(){if(zx)return true;if(!window.ZXing)return false;zx=new ZXing.MultiFormatReader();hints=new Map();hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS,[ZXing.BarcodeFormat.QR_CODE,ZXing.BarcodeFormat.DATA_MATRIX]);hints.set(ZXing.DecodeHintType.TRY_HARDER,true);zx.setHints(hints);return true}
function zxAll(c){
  if(!zxReady())return[];
  const out=[],ctx=c.getContext('2d',{willReadFrequently:true});
  for(let n=0;n<2;n++){
    let r=null;
    try{r=zx.decode(new ZXing.BinaryBitmap(new ZXing.HybridBinarizer(new ZXing.HTMLCanvasElementLuminanceSource(c))),hints)}catch(e){}finally{try{zx.reset()}catch(e){}}
    if(!r)break;
    const format=r.getBarcodeFormat()===ZXing.BarcodeFormat.QR_CODE?'qr':'dm';
    if(out.some(o=>o.format===format))break;
    out.push({format,text:r.getText()});
    const pts=(r.getResultPoints()||[]).filter(Boolean);if(!pts.length)break;
    const xs=pts.map(p=>p.getX()),ys=pts.map(p=>p.getY());
    const x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys),y1=Math.max(...ys),pad=Math.max(x1-x0,y1-y0)*.35+12;
    ctx.fillStyle='#fff';ctx.fillRect(x0-pad,y0-pad,x1-x0+2*pad,y1-y0+2*pad);
  }
  return out;
}
async function native(src){if(!detector)return[];try{return(await detector.detect(src)).map(c=>({format:c.format==='qr_code'?'qr':'dm',text:c.rawValue}))}catch(e){return[]}}
function toCanvas(src,max,crop){
  const W=src.videoWidth||src.width,H=src.videoHeight||src.height;
  const cw=W*(crop?crop[0]:1),ch=H*(crop?crop[1]:1),sx=(W-cw)/2,sy=(H-ch)/2;
  const sc=Math.min(1,max/Math.max(cw,ch)),c=document.createElement('canvas');
  c.width=Math.round(cw*sc);c.height=Math.round(ch*sc);
  const x=c.getContext('2d',{willReadFrequently:true});x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(src,sx,sy,cw,ch,0,0,c.width,c.height);return c;
}

/* ---------- live camera ---------- */
let stream=null,track=null,loop=null,busy=false,wake=null,torchOn=false;
async function start(){
  if(stream)return;
  status('');
  if(!navigator.mediaDevices?.getUserMedia){blocked();return}
  try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1920},height:{ideal:1080}},audio:false})}
  catch(e){stream=null;blocked(e&&e.name);return}
  track=stream.getVideoTracks()[0];
  try{track.applyConstraints({advanced:[{focusMode:'continuous'}]})}catch(e){}
  const v=$('vid');v.srcObject=stream;v.hidden=false;$('frame').hidden=false;$('idle').hidden=true;$('bStop').hidden=false;
  try{await v.play()}catch(e){}
  try{const caps=track.getCapabilities?.();$('bTorch').hidden=!(caps&&caps.torch)}catch(e){}
  try{wake=await navigator.wakeLock?.request('screen')}catch(e){}
  $('bMainTxt').textContent='עצור סריקה';
  status(pending.qr||pending.dm?'':'כוון לקוד הראשון.');
  tick();
}
function stop(){
  clearTimeout(loop);loop=null;
  if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;track=null;torchOn=false;
  $('vid').hidden=true;$('frame').hidden=true;$('idle').hidden=false;$('bStop').hidden=true;$('bTorch').hidden=true;
  try{wake&&wake.release()}catch(e){}wake=null;
  $('bMainTxt').textContent='התחל סריקה';
}
function blocked(name){
  const m=$('idleMsg');m.className='err';
  m.textContent=name==='NotAllowedError'||name==='SecurityError'||!name
    ?'המצלמה החיה חסומה בתצוגה הזו. פתח את הכלי מקובץ barcode-checker.html המאוחסן בכתובת https ואשר גישה למצלמה. בינתיים אפשר להשתמש ב"צילום תמונה" או בסורק ידני.'
    :'לא נמצאה מצלמה זמינה. השתמש ב"צילום תמונה" או בסורק ידני.';
  status('הסריקה החיה לא זמינה כאן.',true);
}
async function tick(){
  if(!stream)return;
  const v=$('vid');
  if(!busy&&v.videoWidth){
    busy=true;
    let found=await native(v);
    if(!found.length&&zxReady())found=zxAll(toCanvas(v,1000,[.84,.76]));
    const now=performance.now();
    for(const f of found){
      const last=seen.get(f.text);seen.set(f.text,now);
      if(last!==undefined&&now-last<1300)continue; // still the same code in view
      accept(f.format,f.text,'live');
    }
    busy=false;
  }
  loop=setTimeout(tick,detector?120:160);
}
$('bTorch').addEventListener('click',async()=>{
  if(!track)return;torchOn=!torchOn;
  try{await track.applyConstraints({advanced:[{torch:torchOn}]})}catch(e){torchOn=false}
  $('bTorch').classList.toggle('on',torchOn);$('bTorch').setAttribute('aria-pressed',torchOn);
});

/* ---------- photo & scanner ---------- */
$('fCam').addEventListener('change',async e=>{
  const file=e.target.files[0];e.target.value='';if(!file)return;
  status('מפענח…');
  let img;try{img=window.createImageBitmap?await createImageBitmap(file):null}catch(x){}
  if(!img)img=await new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.onerror=()=>r(null);i.src=URL.createObjectURL(file)});
  if(!img){status('לא ניתן לקרוא את התמונה.',true);return}
  let found=await native(img);
  if(found.length<2)for(const s of[1600,1000,2400]){zxAll(toCanvas(img,s)).forEach(f=>{if(!found.some(x=>x.format===f.format))found.push(f)});if(found.length>=2)break}
  if(!found.length){status('לא נמצא קוד. צלם קרוב, ישר ובתאורה טובה.',true);return}
  if(phase==='verdict')next();
  found.forEach(f=>accept(f.format,f.text,'photo'));
});
$('scanIn').addEventListener('keydown',e=>{
  if(e.ctrlKey&&(e.key===']'||e.code==='BracketRight')){ // scanners often send GS as Ctrl+]
    e.preventDefault();const el=e.target,p=el.selectionStart;el.value=el.value.slice(0,p)+GS+el.value.slice(el.selectionEnd);el.selectionStart=el.selectionEnd=p+1;return;
  }
  if(e.key!=='Enter')return;
  e.preventDefault();const t=e.target.value;e.target.value='';if(!t.trim())return;
  if(phase==='verdict'){if($('result').classList.contains('bad'))return;next()}
  let k=/^\]Q\d/.test(t)?'qr':/^\]d\d/.test(t)?'dm':(!pending.qr?'qr':'dm');
  accept(k,t,'scanner');
});

/* ---------- log ---------- */
function renderLog(){
  const ok=history.filter(h=>h.r!=='bad').length;
  $('nOk').textContent=ok;$('nBad').textContent=history.length-ok;
  $('logCount').textContent=history.length?'('+history.length+')':'';
  $('logEmpty').hidden=history.length>0;
  $('log').innerHTML=history.slice(-50).reverse().map(h=>{
    const t=new Date(h.t).toLocaleTimeString('he-IL',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
    return'<li><span class="t">'+t+'</span><span class="pill '+h.r+'">'+(h.r==='bad'?'לא תואם':'תואם')+'</span><span class="d" title="'+esc(show(h.qr))+'">'+esc(show(h.qr))+'</span></li>';
  }).join('');
}
$('bCsv').addEventListener('click',()=>{
  if(!history.length){status('היומן ריק.');return}
  const q=s=>'"'+String(s).replace(/"/g,'""')+'"';
  const t=['#,timestamp,result,qr,datamatrix,details'].concat(history.map((h,i)=>[i+1,h.t,h.r==='bad'?'MISMATCH':'MATCH',q(show(h.qr)),q(show(h.dm)),q(h.why)].join(','))).join('\n');
  const ta=$('csvOut'),fb=()=>{ta.hidden=false;ta.value=t;ta.focus();ta.select();status('סמן והעתק את הטקסט מהתיבה.')};
  navigator.clipboard?navigator.clipboard.writeText(t).then(()=>{ta.hidden=true;status('הועתק. אפשר להדביק באקסל.')},fb):fb();
});
$('bClear').addEventListener('click',()=>{$('clearAsk').hidden=false});
$('bClearNo').addEventListener('click',()=>{$('clearAsk').hidden=true});
$('bClearYes').addEventListener('click',()=>{history=[];try{localStorage.setItem('bcm-history','[]')}catch(e){}renderLog();$('clearAsk').hidden=true;$('csvOut').hidden=true;status('היומן אופס.')});

/* ---------- wiring ---------- */
$('bMain').addEventListener('click',()=>{stream?stop():start()});
$('bStop').addEventListener('click',stop);
$('bReset').addEventListener('click',resetPair);
document.addEventListener('keydown',e=>{
  if(phase==='verdict'&&(e.key==='Enter'||e.key===' ')&&document.activeElement!==$('scanIn')){e.preventDefault();next()}
});
document.addEventListener('visibilitychange',async()=>{if(document.visibilityState==='visible'&&stream){try{wake=await navigator.wakeLock?.request('screen')}catch(e){}}});
if(matchMedia('(pointer:fine)').matches)$('scanIn').focus({preventScroll:true});
renderSlots();renderLog();
})();
</script>
